<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    --u: 1vmin;
    background:
      radial-gradient(ellipse at 50% 38%, #1f6a52 0%, #145040 38%, #0b3327 72%, #06211a 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f4efe1;
    display: flex; align-items: center; justify-content: center;
  }
  .scene { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 7); }
  body.haut .scene, body.carre .scene { flex-direction: column; gap: calc(var(--u) * 5); }
  .titre { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .embleme { width: calc(var(--u) * 22); height: calc(var(--u) * 22); filter: drop-shadow(0 1vmin 2vmin #0008); }
  h1 { margin: calc(var(--u) * 1) 0 0; font-size: calc(var(--u) * 15); font-weight: 800; letter-spacing: -.01em;
       text-shadow: 0 .6vmin 1.6vmin #000a; white-space: nowrap; }
  p { margin: calc(var(--u) * 1.5) 0 0; font-size: calc(var(--u) * 5.2); color: #e2c27a; font-weight: 600;
      text-shadow: 0 .4vmin 1vmin #0009; white-space: nowrap; }
  .eventail { position: relative; width: calc(var(--c) * 3.1); height: calc(var(--c) * 1.75); --c: calc(var(--u) * 26); }
  .carte {
    position: absolute; left: calc(50% - var(--c) / 2); bottom: 0;
    width: var(--c); height: calc(var(--c) * 1.42); border-radius: calc(var(--c) * .1);
    background: linear-gradient(160deg, #fffdf6, #efe9d8);
    box-shadow: 0 1.2vmin 3vmin #000a, inset 0 0 0 .25vmin #0001;
    transform-origin: 50% 120%; color: #1b1b1b;
  }
  .carte.rouge { color: #c0392b; }
  .carte .coin { position: absolute; left: 9%; top: 5%; font-size: calc(var(--c) * .3); font-weight: 800; line-height: 1; text-align: center; }
  .carte .coin span { display: block; font-size: calc(var(--c) * .24); margin-top: 4%; }
  .carte .centre { position: absolute; right: 9%; bottom: 5%; font-size: calc(var(--c) * .52); line-height: 1; }
  .carte:nth-child(1) { transform: rotate(-27deg); }
  .carte:nth-child(2) { transform: rotate(-9deg); }
  .carte:nth-child(3) { transform: rotate(9deg); }
  .carte:nth-child(4) { transform: rotate(27deg); }
  body.large h1 { font-size: calc(var(--u) * 12.5); }
  body.large .embleme { width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
  body.large .eventail { --c: calc(var(--u) * 27); }
  body.haut { --u: 1.25vmin; }
  body.haut .scene { padding-top: calc(var(--u) * 6); }
  body.haut .eventail { --c: calc(var(--u) * 25); margin-top: calc(var(--u) * 4); }
  body.carre .scene { padding-top: calc(var(--u) * 14); gap: calc(var(--u) * 3); }
  body.carre .embleme { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }
  body.carre h1 { font-size: calc(var(--u) * 13); }
  body.carre .eventail { --c: calc(var(--u) * 21); margin-top: calc(var(--u) * 2); }
</style></head>
<body>
<div class="scene">
  <div class="titre">
    <svg class="embleme" viewBox="0 0 64 64"><path d="M18 24V13l7.5 6L32 9l6.5 10L46 13v11z" fill="#d9a441"/><path d="M32 54C12 41 14 27 24 27c4.2 0 7 3.2 8 5.4 1-2.2 3.8-5.4 8-5.4 10 0 12 14-8 27z" fill="#c0392b"/></svg>
    <h1>Le Larbin</h1>
  </div>
  <div class="eventail">
    <div class="carte"><div class="coin">9<span>♣</span></div><div class="centre">♣</div></div>
    <div class="carte rouge"><div class="coin">J<span>♦</span></div><div class="centre">♦</div></div>
    <div class="carte rouge"><div class="coin">Q<span>♥</span></div><div class="centre">♥</div></div>
    <div class="carte"><div class="coin">2<span>♠</span></div><div class="centre">♠</div></div>
  </div>
</div>
<script>document.body.className = new URLSearchParams(location.search).get('f') || 'large';</script>
</body></html>
