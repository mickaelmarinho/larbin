  téléphones, qui ne savent pas lire le SVG.
-->

<style>/* Le Larbin — tapis de feutre, cartes crème, laiton pour les actions.
   Pensé pour le téléphone d'abord ; le grand écran ne fait qu'agrandir. */

:root {
  /* Ces sept variables font tout l'habillage : un thème n'est qu'une autre
     liste de valeurs. */
  --fond-haut: #1a5a46;
  --feutre: #0d3b2e;
  --fond-bas: #06231a;
  --panneau-haut: #14503f;
  --panneau-bas: #0c3527;
  --voile: #04140fdd;
  --dos: repeating-linear-gradient(45deg, #8d2f2a 0 4px, #7a2723 4px 8px);
  --creme: #f7f1e3;
  --encre: #1b211f;
  --rouge: #b5342b;
  /* Le cœur de l'emblème doit tenir sur les trois tapis, bordeaux compris. */
  --rouge-embleme: #d8453a;
  --laiton: #d9a441;
  --laiton-sombre: #a97b26;
  --texte: #e8e2d4;
  --texte-pale: #a9b6ad;

  --carte-l: clamp(48px, 13.5vw, 64px);
  --carte-h: calc(var(--carte-l) * 1.42);
  --rayon: calc(var(--carte-l) * 0.11);
  --chevauchement: 0px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background:
    radial-gradient(ellipse 120% 80% at 50% 22%, var(--fond-haut) 0%, var(--feutre) 55%, var(--fond-bas) 100%);
  color: var(--texte);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

#table {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  gap: 6px;
}

/* ------------------------------------------------------------ adversaires */

#adversaires {
  display: flex;
  justify-content: center;
  gap: clamp(6px, 2.5vw, 18px);
  flex-wrap: wrap;
}

.joueur {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 9px 7px;
  border-radius: 12px;
  border: 1px solid transparent;
  min-width: 74px;
  transition: border-color .25s, background .25s, transform .25s;
}

.joueur.actif {
  border-color: var(--laiton);
  background: #ffffff0f;
  box-shadow: 0 0 16px #d9a44133;
}

.joueur.sorti { opacity: .55; }

.joueur .nom {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .2px;
}

.joueur .etat {
  font-size: 11px;
  color: var(--texte-pale);
  min-height: 14px;
}

.dos-pile {
  display: flex;
  align-items: center;
  gap: 5px;
  height: calc(var(--carte-h) * 0.42);
}

.dos {
  width: calc(var(--carte-l) * 0.42);
  height: calc(var(--carte-h) * 0.42);
  border-radius: 4px;
  background: var(--dos);
  border: 1px solid #00000055;
  box-shadow: 0 1px 3px #0006;
}

.dos + .dos { margin-left: calc(var(--carte-l) * -0.28); }

.compte {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--texte);
  background: #00000040;
  border-radius: 999px;
  padding: 1px 7px;
}

.role {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .7px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid currentColor;
}

.role.boss { color: var(--laiton); }
.role.sous-boss { color: #cbd8c8; }
.role.neutre { color: var(--texte-pale); }
.role.sur-larbin { color: #d99b7a; }
.role.larbin { color: #e0736a; }

/* ------------------------------------------------------------------ tapis */

#tapis {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  min-height: 0;
}

#annonce {
  font-size: 13px;
  color: var(--texte-pale);
  height: 18px;
  text-align: center;
  transition: opacity .2s;
}

#pose {
  display: flex;
  justify-content: center;
  min-height: var(--carte-h);
}

#pose .carte + .carte { margin-left: calc(var(--carte-l) * -0.42); }

#exigence {
  font-size: 13px;
  color: var(--texte);
  background: #00000038;
  padding: 4px 12px;
  border-radius: 999px;
  min-height: 25px;
  display: flex;
  align-items: center;
}

#exigence.vide { background: none; color: var(--texte-pale); }

/* ------------------------------------------------------------- ma main */

#moi {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

#ma-ligne {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--texte-pale);
}

#ma-main {
  display: flex;
  justify-content: center;
  padding-top: 18px;
  width: 100%;
}

#ma-main .carte + .carte { margin-left: calc(-1 * var(--chevauchement)); }

#actions {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 420px;
}

button.action {
  flex: 1;
  padding: 13px 10px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  border-radius: 12px;
  border: 1px solid #ffffff26;
  background: #ffffff12;
  color: var(--texte);
  cursor: pointer;
  transition: transform .12s, background .2s, opacity .2s;
}

button.action:active { transform: scale(.97); }

button.action.primaire {
  background: linear-gradient(var(--laiton), var(--laiton-sombre));
  border-color: var(--laiton);
  color: #2a1c04;
}

button.action:disabled {
  opacity: .38;
  cursor: default;
}

/* ------------------------------------------------------------- les cartes */

.carte {
  position: relative;
  flex: 0 0 auto;
  width: var(--carte-l);
  height: var(--carte-h);
  border-radius: var(--rayon);
  border: 1px solid #00000038;
  padding: 0;
  background: linear-gradient(160deg, #fffdf6 0%, var(--creme) 62%, #ece2cd 100%);
  color: var(--encre);
  box-shadow: 0 2px 5px #0007, inset 0 0 0 1px #ffffff80;
  font-family: inherit;
  cursor: default;
  transition: transform .18s cubic-bezier(.2, .8, .3, 1.2), box-shadow .18s, filter .2s;
}

.carte.rouge { color: var(--rouge); }

.carte .coin {
  position: absolute;
  top: 3px;
  left: 4px;
  font-size: calc(var(--carte-l) * 0.3);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.5px;
}

.carte .coin i {
  display: block;
  font-style: normal;
  font-size: calc(var(--carte-l) * 0.26);
}

.carte .centre {
  position: absolute;
  right: calc(var(--carte-l) * 0.09);
  bottom: calc(var(--carte-l) * 0.06);
  font-size: calc(var(--carte-l) * 0.5);
  line-height: 1;
  opacity: .9;
}

/* Les cartes se recouvrent : une ombre portée sur le bord gauche fait lire
   l'éventail comme une pile, et non comme un bandeau blanc. */
#ma-main .carte,
#pose .carte {
  box-shadow: -4px 0 8px #00000047, 0 2px 5px #0007, inset 0 0 0 1px #ffffff80;
}

#ma-main .carte { cursor: pointer; }

#ma-main .carte.jouable:hover { transform: translateY(-7px); }

#ma-main .carte.choisie {
  transform: translateY(-18px);
  box-shadow: 0 8px 16px #0008, inset 0 0 0 2px var(--laiton);
}

#ma-main .carte.morte {
  filter: grayscale(.75) brightness(.72);
  cursor: default;
}

/* -------------------------------------------------------------- le voile */

#voile {
  position: fixed;
  inset: 0;
  background: var(--voile);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

#voile[hidden] { display: none !important; }

.panneau {
  background: linear-gradient(var(--panneau-haut), var(--panneau-bas));
  border: 1px solid #ffffff20;
  border-radius: 18px;
  padding: 20px 18px;
  width: min(420px, 100%);
  max-height: 100%;
  overflow-y: auto;
  box-shadow: 0 18px 50px #000a;
}

.panneau h2 {
  margin: 0 0 4px;
  font-size: 19px;
  letter-spacing: .3px;
}

.panneau p {
  margin: 0 0 14px;
  font-size: 14px;
  color: var(--texte-pale);
  line-height: 1.45;
}

.panneau .cartes-recues {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 14px;
}

.classement {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
}

.classement li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 4px;
  border-bottom: 1px solid #ffffff14;
  font-size: 15px;
}

.classement li:last-child { border-bottom: none; }

.classement .place {
  color: var(--texte-pale);
  font-size: 12px;
  min-width: 22px;
}

.classement .sur-un-deux {
  font-size: 11px;
  color: #e0736a;
}

#choix-rendu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  margin-bottom: 16px;
}

#choix-rendu .carte { cursor: pointer; }

#choix-rendu .carte.choisie {
  transform: translateY(-8px);
  box-shadow: 0 8px 16px #0008, inset 0 0 0 2px var(--laiton);
}

@media (min-width: 700px) {
  :root { --carte-l: 68px; }
  #table { max-width: 860px; margin: 0 auto; }
}

.panneau p.mention {
  margin: 0 0 8px;
  font-size: 13px;
  color: var(--texte-pale);
}

/* ------------------------------------------------------------- les scores */

#scores {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--texte-pale);
}

#tableau-scores {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  min-width: 0;
}

#tableau-scores .marque {
  white-space: nowrap;
}

#tableau-scores .marque b {
  color: var(--texte);
  font-variant-numeric: tabular-nums;
}

#tableau-scores .marque.moi b { color: var(--laiton); }

#tableau-scores .objectif {
  margin-left: auto;
  opacity: .8;
}

#recommencer {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid #ffffff1f;
  background: #ffffff10;
  color: var(--texte-pale);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}

#recommencer:active { transform: scale(.94); }

.classement .gain {
  color: var(--texte-pale);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* Les cartes que vous posez montent depuis votre main ; celles des autres
   descendent d'en face. */
#pose .carte { animation: arrivee-adverse .28s cubic-bezier(.2, .9, .3, 1.2) backwards; }
#pose.de-moi .carte { animation-name: arrivee-mienne; }

@keyframes arrivee-adverse {
  from { transform: translateY(-30px) scale(.86); opacity: 0; }
}

@keyframes arrivee-mienne {
  from { transform: translateY(30px) scale(.86); opacity: 0; }
}

/* ------------------------------------------- ce qui peut encore sortir */

#voir-restantes,
#sons {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid #ffffff1f;
  background: #ffffff10;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}

#sons.coupes { opacity: .5; }

#voir-restantes.actif {
  border-color: var(--laiton);
  background: #d9a44122;
}

#restantes {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  max-width: 320px;
}

#restantes[hidden] { display: none; }

#restantes .hauteur {
  display: flex;
  align-items: baseline;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 999px;
  background: #00000033;
  font-size: 12px;
  color: var(--texte-pale);
}

#restantes .hauteur b {
  color: var(--texte);
  font-variant-numeric: tabular-nums;
}

#restantes .hauteur.epuisee {
  opacity: .35;
}

/* --------------------------------------------------- accueil et salon */

#table[hidden] { display: none; }

.panneau .champ {
  display: block;
  font-size: 13px;
  color: var(--texte-pale);
  margin-bottom: 14px;
}

.panneau input[type="text"] {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 11px 12px;
  font: inherit;
  font-size: 16px; /* en dessous de 16px, iOS zoome tout seul sur le champ */
  color: var(--texte);
  background: #00000038;
  border: 1px solid #ffffff26;
  border-radius: 10px;
}

.panneau input[type="text"]:focus {
  outline: none;
  border-color: var(--laiton);
}

.panneau .action + .action { margin-top: 8px; }

.panneau .action {
  display: block;
  width: 100%;
}

.rejoindre {
  display: flex;
  gap: 8px;
  align-items: stretch;
  margin: 8px 0 0;
}

.rejoindre input[type="text"] {
  margin-top: 0;
  min-width: 0;
}

.rejoindre .action {
  width: auto;
  flex: 0 0 auto;
  margin-top: 0;
  padding: 11px 14px;
}

.panneau .mention.alerte { color: #e0a08a; }

/* La consigne du didacticiel : présente, jamais envahissante. */
#lecon {
  margin: 2px 4px 0;
  padding: 9px 12px;
  border-radius: 10px;
  border-left: 3px solid var(--laiton);
  background: #ffffff12;
  color: var(--texte);
  font-size: 14px;
  line-height: 1.45;
}

#lecon .etape {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--laiton);
  color: #2a1e05;
  font-size: 12px;
  font-weight: 600;
}

/* Les quelques règles qu'il faut pour jouer : lisibles d'un trait. */
.panneau ul.vite {
  margin: 12px 0 0;
  padding-left: 18px;
}

.panneau ul.vite li {
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--texte);
}

.panneau ul.vite li::marker { color: var(--laiton); }

/* Le choix du nombre de joueurs, en ligne sous les places. */
.panneau p.taille {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 14px 0 0;
  color: var(--texte-pale);
  font-size: 13px;
}

/* La taille retenue : elle doit se voir du premier coup d'œil. */
button.mini.choisi {
  background: var(--laiton);
  border-color: transparent;
  color: #2a1e05;
  font-weight: 600;
}

button.mini:disabled {
  opacity: .4;
  cursor: default;
}

/* Le même bouton, mais portant un mot plutôt qu'une croix : il prend alors la
   largeur qu'il lui faut, sinon le texte débordait de la liste. */
button.mini.mot {
  width: auto;
  height: auto;
  padding: 5px 10px;
  white-space: nowrap;
  color: var(--texte);
  font-size: 13px;
}

button.mini {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: 1px solid #ffffff1f;
  background: #ffffff10;
  color: var(--texte-pale);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}

/* La série est close : les cartes attendent d'être ramassées. */
#pose.finie .carte {
  opacity: .38;
  filter: saturate(.6);
}

/* Un joueur qui a décroché : la table l'attend, autant que ça se voie. */
.joueur.absent {
  opacity: .6;
}

.joueur.absent .etat {
  color: #e0a08a;
}

.joueur.absent .dos {
  filter: grayscale(.7);
}

/* ------------------------------------------------------------ réactions */

.joueur { position: relative; }

.bulle {
  position: absolute;
  top: -10px;
  right: -6px;
  font-size: 24px;
  line-height: 1;
  pointer-events: none;
  filter: drop-shadow(0 2px 3px #0008);
  animation: bulle 3.5s ease-out forwards;
}

/* La palette s'ancre sur le bloc du joueur, qui prend toute la largeur : sur
   sa seule ligne, centrée et étroite, elle déborderait de l'écran. */
#moi { position: relative; }
#ma-ligne .bulle { position: static; font-size: 20px; }

@keyframes bulle {
  0% { transform: scale(.3) translateY(8px); opacity: 0; }
  8% { transform: scale(1.15); opacity: 1; }
  14% { transform: scale(1); }
  85% { transform: scale(1); opacity: 1; }
  100% { transform: translateY(-10px); opacity: 0; }
}

#reagir {
  margin-left: auto;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  border: 1px solid #ffffff1f;
  background: #ffffff10;
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}

#reagir.actif {
  border-color: var(--laiton);
  background: #d9a44122;
}

.palette {
  position: absolute;
  left: 0;
  right: 0;
  width: max-content;
  max-width: calc(100% - 8px);
  margin-inline: auto;
  flex-wrap: wrap;
  justify-content: center;
  bottom: calc(100% + 6px);
  z-index: 5;
  display: flex;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  border: 1px solid #ffffff24;
  background: var(--panneau-bas);
  box-shadow: 0 6px 18px #0007;
  animation: palette .15s ease-out;
}

.palette button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
}

.palette button:active {
  transform: scale(.9);
  background: #ffffff14;
}

@keyframes palette {
  from { transform: translateY(6px); opacity: 0; }
}

/* ------------------------------------------------------- choix du tapis */

#tapis-choix {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid #ffffff1f;
  background: #ffffff10;
  color: var(--texte-pale);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
}

#tapis-choix:active { transform: scale(.94); }

.tapis-liste {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

.tapis-liste button {
  flex: 1 1 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 10px 8px;
  border-radius: 12px;
  border: 1px solid #ffffff20;
  background: #ffffff0e;
  color: var(--texte);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.tapis-liste button.actif { border-color: var(--laiton); }

.tapis-liste .apercu {
  width: 100%;
  height: 34px;
  border-radius: 8px;
  border: 1px solid #00000040;
  position: relative;
  overflow: hidden;
}

.tapis-liste .apercu i {
  position: absolute;
  right: 8px;
  top: 5px;
  width: 16px;
  height: 24px;
  border-radius: 3px;
  border: 1px solid #00000055;
}

.panneau .mention a {
  color: var(--laiton);
}

/* Le curseur de la coupe. */
.panneau input[type="range"] {
  width: 100%;
  margin-top: 10px;
  accent-color: var(--laiton);
}

/* L'emblème en tête d'accueil : la dame de cœur et la couronne. */
.panneau .embleme {
  display: block;
  width: 40px;
  height: 40px;
  margin: 0 0 4px;
  opacity: .95;
}

/* Un lien discret, pour ce qui se lit sans encombrer. */
button.lien {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 4px;
  border: none;
  background: none;
  color: var(--texte-pale);
  font: inherit;
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

button.lien:hover { color: var(--texte); }

.panneau sup { font-size: .7em; }

/* ------------------------------------------------------------- parcours */

/* Le rappel glissé sous le classement de fin de partie. */
.panneau .trace {
  margin: 10px 0 0;
  color: var(--texte-pale);
  font-size: 14px;
}
.panneau .trace button.lien {
  display: inline;
  width: auto;
  margin: 0 0 0 4px;
  padding: 0;
  font-size: inherit;
}

.panneau h3 {
  margin: 20px 0 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--texte-pale);
}

.compteurs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 14px 0 4px;
}
.compteurs div {
  padding: 10px 12px;
  border-radius: 8px;
  background: #ffffff0f;
}
.compteurs b {
  display: block;
  font-size: 22px;
  line-height: 1.1;
  color: var(--laiton);
}
.compteurs span {
  font-size: 12px;
  color: var(--texte-pale);
}

/* Les rôles obtenus : c'est là qu'on lit vraiment sa saison. */
.roles { margin-top: 14px; }
.part {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  font-size: 13px;
}
.part .nom { flex: 0 0 74px; color: var(--texte-pale); }
.part .jauge {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: #ffffff14;
  overflow: hidden;
}
.part .jauge i {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: var(--texte-pale);
}
.part .jauge i.boss { background: var(--laiton); }
.part .jauge i.larbin { background: var(--rouge-embleme); }
.part .chiffre { flex: 0 0 38px; text-align: right; color: var(--texte); }

/* La liste des parties passees : c'est la place qui compte, pas la date. */
.classement.parties li { font-size: 13px; color: var(--texte-pale); }
.classement.parties .place { color: var(--texte); font-size: 13px; }

/* Les places encore libres à une table publique : présentes, mais en retrait. */
.classement li.libre span {
  color: var(--texte-pale);
  font-style: italic;
}</style>

<div id="table" hidden>

    <button id="tapis-choix" type="button" title="Changer de tapis">◨</button>
    <button id="voir-restantes" type="button" title="Ce que les autres peuvent encore avoir">👁</button>
    <button id="recommencer" type="button" title="Nouvelle partie">↺</button>
  </div>
  <div id="adversaires"></div>

  <div id="lecon" hidden></div>

  <div id="tapis">

    <div id="pose"></div>
    <div id="exigence"></div>
    <div id="restantes" hidden></div>
  </div>

  <div id="moi">
    <div id="ma-ligne"></div>
    <div id="ma-main"></div>
    <div id="actions">
      <button class="action" id="passer" type="button">Passer</button>
      <button class="action primaire" id="poser" type="button">Poser</button>
    </div>
  </div>
</div>

<div id="voile" hidden></div>
